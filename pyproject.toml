[project]
name = "odin-etl"
version = "0.1.0"
description = ""
authors = [
    { name = "Brenno Henrique", email = "brennohdev@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.0",
    "geopandas>=0.14",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "unidecode>=1.3",
    "boto3>=1.34",
    "pandarallel>=1.6",
    "geopy>=2.4",
    "basedosdados>=2.0.3",
    "shapely>=2.0",
    "openpyxl (>=3.1.5,<4.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mongomock>=4.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mongomock>=4.1",
    "pytest>=8.0",
]