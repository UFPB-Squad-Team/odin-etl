[tool.poetry]
name = "odin-etl"
version = "0.1.0"
description = ""
authors = ["Brenno Henrique <brennohdev@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12"
pandas = ">=2.0"
geopandas = ">=0.14"
pymongo = ">=4.6"
python-dotenv = ">=1.0"
pyarrow = ">=14.0"
pyyaml = ">=6.0"
requests = ">=2.31"
unidecode = ">=1.3"
