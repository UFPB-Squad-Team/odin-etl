# ODIN-ETL - Configuracao do Geocode Pipeline

# Caminhos locais das camadas Medallion (Bronze -> Silver -> Gold)
paths:
  bronze: "data/bronze"
  silver: "data/silver"
  gold: "data/gold"
  checkpoints: "data/checkpoints"

# Fonte de dados: Censo Escolar INEP
ingestion_sources:
  censo_escolar:
    url: "https://download.inep.gov.br/dados_abertos/microdados_censo_escolar_2024.zip"
    output_filename: "censo_2024.zip"
    target_filename_in_zip: "microdados_ed_basica_2024.csv"
    silver_output: "censo_nordeste_2024.parquet"

geocode_pipeline:
  extract:
    filtro_uf: ["PB"]
    filtro_dependencia_adm: [1, 2, 3]
    filtro_situacao_funcionamento: 1
    csv_delimiter: ";"
    csv_encoding: "latin-1"
    silver_output: "escolas_pb.parquet"

  transform:
    colunas_endereco:
      - "CO_ENTIDADE"
      - "SG_UF"
      - "DS_ENDERECO"
      - "NU_ENDERECO"
      - "NO_BAIRRO"
      - "CO_CEP"
      - "NO_MUNICIPIO"
    coluna_endereco_final: "endereco_completo"
    gold_output: "escolas_pb_geocoded.parquet"
    checkpoint_output: "geocode_progress.parquet"
    batch_size: 100

geo_pipeline:
  ibge:
    setores_censitarios_url: "https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_de_setores_censitarios__divisoes_intramunicipais/censo_2022/setores_censitarios_shp/pb/pb_setores_censitarios.zip"
    municipios_url: "https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2022/UFs/PB/PB_Municipios_2022.zip"
    setores_silver_output: "setores_censitarios_pb.parquet"
    municipios_silver_output: "municipios_pb.parquet"

  colunas_metricas:
    matriculas: ["QT_MAT_FUND", "QT_MAT_MED", "QT_MAT_INF"]
    internet: "IN_INTERNET"
    biblioteca: "IN_BIBLIOTECA"
    lab_informatica: "IN_LABORATORIO_INFORMATICA"
    sem_acessibilidade: "IN_ACESSIBILIDADE_INEXISTENTE"

  mongodb:
    colecao_bairros: "bairro_indicadores"
    colecao_municipios: "municipio_indicadores"

inep_resultados_pipeline:
  sources:
    inse:
      url: "https://download.inep.gov.br/informacoes_estatisticas/indicadores_educacionais/2023/inse_2023.zip"
      output_filename: "inse_2023.zip"
      target_filename: "inse_2023.xlsx"
      silver_output: "inse_2023.parquet"
    ideb_anos_iniciais:
      url: "https://download.inep.gov.br/educacao_basica/portal_ideb/planilhas_para_download/2023/divulgacao_anos_iniciais_escolas_2023.xlsx"
      output_filename: "ideb_anos_iniciais_2023.xlsx"
      silver_output: "ideb_anos_iniciais_2023.parquet"
    ideb_anos_finais:
      url: "https://download.inep.gov.br/educacao_basica/portal_ideb/planilhas_para_download/2023/divulgacao_anos_finais_escolas_2023.xlsx"
      output_filename: "ideb_anos_finais_2023.xlsx"
      silver_output: "ideb_anos_finais_2023.parquet"

  # Colunas relevantes de cada fonte (chave de join: CO_ENTIDADE)
  colunas:
    inse:
      - "CO_ESCOLA"       # chave de join (equivale a CO_ENTIDADE)
      - "INSE_VALOR_ABSOLUTO"
      - "INSE_CLASSIFICACAO"
    ideb:
      - "CO_ESCOLA"
      - "VL_OBSERVADO_2023"   # IDEB observado
      - "VL_META_2023"        # Meta IDEB

  gold_output: "escolas_pb_com_indicadores.parquet"
  mongodb:
    colecao: "escolas"        # mesmo upsert da geocode pipeline — enriquece o documento
