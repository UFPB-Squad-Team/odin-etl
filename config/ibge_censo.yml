# ODIN-ETL — Configuração do pipeline IBGE Censo Demográfico 2022
# Fonte: ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios

ftp:
  host: "ftp.ibge.gov.br"
  base_dir: "/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios"
  timeout_segundos: 60
  max_tentativas: 3

# Filtro geográfico — códigos IBGE das UFs do Nordeste
filtro_uf:
  - "21"  # Maranhão
  - "22"  # Piauí
  - "23"  # Ceará
  - "24"  # Rio Grande do Norte
  - "25"  # Paraíba
  - "26"  # Pernambuco
  - "27"  # Alagoas
  - "28"  # Sergipe
  - "29"  # Bahia

csv:
  encoding: "latin-1"
  separador: ";"

paths:
  bronze: "data/bronze"
  silver: "data/silver"
  gold:   "data/gold"

# Granularidades disponíveis no FTP do IBGE.
# ftp_dir:          subdiretório dentro de ftp.base_dir
# prefixo_arquivo:  prefixo do nome do ZIP no FTP
granularidades:
  municipio:
    ftp_dir: "Agregados_por_Municipio_csv"
    prefixo_arquivo: "Agregados_por_municipios"
  setor:
    ftp_dir: "Agregados_por_Setor_csv"
    prefixo_arquivo: "Agregados_por_setores"
  bairro:
    ftp_dir: "Agregados_por_Bairro_csv"
    prefixo_arquivo: "Agregados_por_bairros"

# Datasets temáticos a baixar.
# Consulte docs/modulo-socioeconomico para o mapeamento de variáveis por dataset.
datasets:
  - basico                       # população total, domicílios (V0001..V0007)
  - demografia                   # estrutura etária por sexo (V01006..V01041)
  - cor_ou_raca                  # distribuição racial (V01317..V01321)
  - caracteristicas_domicilio1   # tipo de domicílio, superlotação, improvisados (V00001..V00089)
  - caracteristicas_domicilio2   # água, esgoto e lixo (V00111, V00309, V00397..V00402)
  - caracteristicas_domicilio3   # outros dados de domicílio
  - alfabetizacao                # alfabetização por faixa etária (V00748..V00760, V00901)
  - obitos                       # óbitos domiciliares 2019-2022 (V01224...)
  - parentesco                   # estrutura familiar — responsável feminino (V01042, V01063)

# Arquivos com sufixo de data no nome (ex: _20250417).
# Verificado diretamente no FTP em abril/2026.
# Se o IBGE publicar nova versão, atualize os nomes aqui.
nomes_com_data:
  Agregados_por_municipios_basico_BR:                     "Agregados_por_municipios_basico_BR_20250417.zip"
  Agregados_por_municipios_caracteristicas_domicilio2_BR: "Agregados_por_municipios_caracteristicas_domicilio2_BR_20250417.zip"
  Agregados_por_municipios_caracteristicas_domicilio3_BR: "Agregados_por_municipios_caracteristicas_domicilio3_BR_20250417.zip"
  Agregados_por_setores_basico_BR:                        "Agregados_por_setores_basico_BR_20250417.zip"
  Agregados_por_setores_caracteristicas_domicilio2_BR:    "Agregados_por_setores_caracteristicas_domicilio2_BR_20250417.zip"
  Agregados_por_setores_caracteristicas_domicilio3_BR:    "Agregados_por_setores_caracteristicas_domicilio3_BR_20250417.zip"
  Agregados_por_bairros_basico_BR:                        "Agregados_por_bairros_basico_BR_20250417.zip"
  Agregados_por_bairros_caracteristicas_domicilio2_BR:    "Agregados_por_bairros_caracteristicas_domicilio2_BR_20250417.zip"
  Agregados_por_bairros_caracteristicas_domicilio3_BR:    "Agregados_por_bairros_caracteristicas_domicilio3_BR_20250417.zip"

dicionario:
  filename: "dicionario_de_dados_agregados_por_setores_censitarios_20250417.xlsx"
  sheet_name: "Dicionário não PCT"
  bronze_output: "dicionario_ibge_censo2022.parquet"

# ---------------------------------------------------------------------------
# Transform — Município
# ---------------------------------------------------------------------------
transform_municipio:
  # Arquivos Silver de entrada.
  # Chave: nome lógico usado internamente no transform.
  # Valor: nome do arquivo no Silver.
  silver_inputs:
    basico:       "ibge_censo2022_municipio_basico_pb.parquet"
    demografia:   "ibge_censo2022_municipio_demografia_pb.parquet"
    cor_raca:     "ibge_censo2022_municipio_cor_ou_raca_pb.parquet"
    dom2:         "ibge_censo2022_municipio_caracteristicas_domicilio2_pb.parquet"
    dom1:         "ibge_censo2022_municipio_caracteristicas_domicilio1_pb.parquet"
    alfabetizacao: "ibge_censo2022_municipio_alfabetizacao_pb.parquet"
    parentesco:   "ibge_censo2022_municipio_parentesco_pb.parquet"
    obitos:       "ibge_censo2022_municipio_obitos_pb.parquet"

  gold_output: "municipio_socioeconomico_pb.parquet"

  # Número esperado de municípios da PB no Censo 2022.
  municipios_esperados: 223

  # Range de benchmark para a população total da PB.
  # v0001 conta domicílios particulares — diferença de ~85k para o oficial é esperada.
  pop_total_min: 3_800_000
  pop_total_max: 4_200_000
  # Contratos de qualidade derivados da EDA estatística.
  # Ranges validados contra dados oficiais do IBGE.
  # Se um valor sair do range, o dado está errado — não o range.
  # Campos: coluna, min, max, descricao
  contratos_qualidade:
    - coluna: total_populacao
      min: 1000
      max: 900000
      descricao: "Pop municipal PB: min ~1.7k, max ~834k"

    - coluna: media_moradores_por_domicilio
      min: 2.0
      max: 4.0
      descricao: "Média moradores: entre 2.0 e 4.0"

    - coluna: pct_criancas_0_9
      min: 5.0
      max: 25.0
      descricao: "Crianças 0-9: entre 5% e 25%"

    - coluna: pct_idosos_60_mais
      min: 8.0
      max: 30.0
      descricao: "Idosos 60+: entre 8% e 30%"

    - coluna: pct_preta_parda
      min: 5.0
      max: 85.0
      descricao: "Preta/parda: entre 5% e 85% (inclui municípios indígenas)"

    - coluna: pct_agua_rede_geral
      min: 0.0
      max: 100.0
      descricao: "Água rede: 0% a 100% (municípios rurais podem ter 0%)"

    - coluna: pct_esgoto_rede_geral
      min: 0.0
      max: 100.0
      descricao: "Esgoto rede: 0% a 100%"

    - coluna: pct_lixo_coletado
      min: 0.0
      max: 100.0
      descricao: "Lixo coletado: 0% a 100%"

    - coluna: taxa_analfabetismo_15_mais
      min: 3.0
      max: 40.0
      descricao: "Analfabetismo 15+: entre 3% e 40%"

    - coluna: pct_responsavel_feminino
      min: 25.0
      max: 80.0
      descricao: "Responsável feminino: entre 25% e 80%"
